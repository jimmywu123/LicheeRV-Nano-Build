name: Build ST7703 fip.bin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 flex bison bc libssl-dev

      - name: Download host tools
        run: |
          wget -q https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz
          tar xf host-tools.tar.gz
          mv host-tools gcc

      - name: Apply ST7703 panel patch
        run: |
          git apply patches/0001-licheervnano-add-st7703-4p7-720x1280-panel.patch

      - name: Build fip
        run: |
          source build/cvisetup.sh
          defconfig sg2002_licheervnano_sd
          clean_uboot
          clean_opensbi
          clean_fsbl
          build_fsbl

      - name: Upload fip.bin
        uses: actions/upload-artifact@v4
        with:
          name: fip-st7703
          path: install/soc_sg2002_licheervnano_sd/fip.bin

